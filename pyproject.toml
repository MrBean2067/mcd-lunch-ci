[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcd-lunch-ci"
version = "1.0.0"
description = "把「今天吃什么」变成一条 CI 流水线：麦当劳 MCP + 约束求解 + 核价 + 下单护栏"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []
keywords = ["mcdonalds", "mcp", "optimization", "knapsack", "team-lunch"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
mcd-lunch-ci = "mcd_lunch_ci.cli:main"

[tool.setuptools]
packages = ["mcd_lunch_ci"]
